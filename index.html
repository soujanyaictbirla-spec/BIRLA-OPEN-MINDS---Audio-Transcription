<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
BIRLA OPEN MINDS - Audio Transcription
</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f4f7fb,
      #e8eef7
    );

  min-height: 100vh;

  padding: 30px;

}

.container {

  max-width: 900px;

  margin: auto;

  background: white;

  border-radius: 18px;

  padding: 35px;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,0.12);

}

.header {

  text-align: center;

  margin-bottom: 30px;

}

.header h1 {

  margin: 0;

  font-size: 32px;

  color: #1f3c88;

}

.header h2 {

  margin-top: 8px;

  font-size: 20px;

  color: #555;

}

.header p {

  color: #777;

}

.form-group {

  margin-bottom: 20px;

}

label {

  display: block;

  font-weight: bold;

  margin-bottom: 8px;

  color: #333;

}

input,
select {

  width: 100%;

  padding: 13px;

  border:
    1px solid #ccc;

  border-radius: 8px;

  font-size: 16px;

}

input:focus,
select:focus {

  outline: none;

  border-color: #1f3c88;

}

button {

  width: 100%;

  padding: 15px;

  border: none;

  border-radius: 9px;

  background: #1f3c88;

  color: white;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

button:hover {

  opacity: 0.9;

}

button:disabled {

  background: #999;

  cursor: not-allowed;

}

.status {

  margin-top: 20px;

  padding: 14px;

  border-radius: 8px;

  background: #f1f5f9;

  display: none;

  text-align: center;

}

.results {

  margin-top: 30px;

  display: none;

}

.result-box {

  margin-top: 18px;

}

.result-title {

  font-size: 17px;

  font-weight: bold;

  margin-bottom: 8px;

  color: #333;

}

textarea {

  width: 100%;

  min-height: 140px;

  resize: vertical;

  padding: 14px;

  border:
    1px solid #ccc;

  border-radius: 8px;

  font-size: 15px;

  line-height: 1.5;

}

.footer {

  text-align: center;

  margin-top: 30px;

  color: #888;

  font-size: 13px;

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>
      BIRLA OPEN MINDS
    </h1>

    <h2>
      Audio Transcription System
    </h2>

    <p>
      Upload an audio file and convert the conversation into text.
    </p>

  </div>


  <div class="form-group">

    <label for="studentName">
      Student Name
    </label>

    <input
      type="text"
      id="studentName"
      placeholder="Enter student name">

  </div>


  <div class="form-group">

    <label for="grade">
      Grade
    </label>

    <select id="grade">

      <option value="">
        Select Grade
      </option>

      <option value="Grade 1">
        Grade 1
      </option>

      <option value="Grade 2">
        Grade 2
      </option>

      <option value="Grade 3">
        Grade 3
      </option>

      <option value="Grade 4">
        Grade 4
      </option>

      <option value="Grade 5">
        Grade 5
      </option>

      <option value="Grade 6">
        Grade 6
      </option>

      <option value="Grade 7">
        Grade 7
      </option>

      <option value="Grade 8">
        Grade 8
      </option>

      <option value="Grade 9">
        Grade 9
      </option>

      <option value="Grade 10">
        Grade 10
      </option>

      <option value="Grade 11">
        Grade 11
      </option>

      <option value="Grade 12">
        Grade 12
      </option>

    </select>

  </div>


  <div class="form-group">

    <label for="audioFile">
      Select Audio File
    </label>

    <input
      type="file"
      id="audioFile"
      accept="audio/*">

  </div>


  <button
    id="convertButton"
    onclick="convertAudio()">

    Convert Audio to Text

  </button>


  <div
    class="status"
    id="status">
  </div>


  <div
    class="results"
    id="results">


    <div class="result-box">

      <div class="result-title">
        Complete Transcript
      </div>

      <textarea
        id="completeTranscript"
        readonly>
      </textarea>

    </div>


    <div class="result-box">

      <div class="result-title">
        Person 1
      </div>

      <textarea
        id="person1"
        readonly>
      </textarea>

    </div>


    <div class="result-box">

      <div class="result-title">
        Person 2
      </div>

      <textarea
        id="person2"
        readonly>
      </textarea>

    </div>


  </div>


  <div class="footer">

    BIRLA OPEN MINDS INTERNATIONAL SCHOOL

  </div>

</div>


<script>

// ============================================================
// GOOGLE APPS SCRIPT WEB APP URL
// ============================================================

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyOoxOs6tVhcYAyGFDeRylglXtWA_a8Lv5iVDQUD07N2EAfWQR8_21jjnPHFJiCEBOu8g/exec";


// ============================================================
// CONVERT AUDIO
// ============================================================

async function convertAudio() {

  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();

  const grade =
    document
      .getElementById("grade")
      .value;

  const audioInput =
    document
      .getElementById("audioFile");

  const button =
    document
      .getElementById("convertButton");

  const status =
    document
      .getElementById("status");

  const results =
    document
      .getElementById("results");


  // ----------------------------------------------------------
  // VALIDATION
  // ----------------------------------------------------------

  if (!studentName) {

    alert(
      "Please enter the student name."
    );

    return;

  }


  if (!grade) {

    alert(
      "Please select the grade."
    );

    return;

  }


  if (
    !audioInput.files ||
    audioInput.files.length === 0
  ) {

    alert(
      "Please select an audio file."
    );

    return;

  }


  const file =
    audioInput.files[0];


  // Keep file size reasonable
  const maxSize =
    20 * 1024 * 1024;


  if (file.size > maxSize) {

    alert(
      "Please select an audio file smaller than 20 MB."
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "Converting...";


  status.style.display =
    "block";


  status.textContent =
    "Reading audio file...";


  results.style.display =
    "none";


  try {

    // --------------------------------------------------------
    // CONVERT FILE TO BASE64
    // --------------------------------------------------------

    const base64Audio =
      await fileToBase64(file);


    status.textContent =
      "Sending audio for transcription...";


    // --------------------------------------------------------
    // SEND TO GOOGLE APPS SCRIPT
    // --------------------------------------------------------

    const requestData = {

      studentName:
        studentName,

      grade:
        grade,

      fileName:
        file.name,

      audioBase64:
        base64Audio

    };


    const response =
      await fetch(
        GOOGLE_SCRIPT_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              requestData
            )

        }
      );


    if (!response.ok) {

      throw new Error(
        "Server returned error: " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "Transcription failed."
      );

    }


    // --------------------------------------------------------
    // SHOW TRANSCRIPT
    // --------------------------------------------------------

    document
      .getElementById(
        "completeTranscript"
      )
      .value =
        result.transcript || "";


    document
      .getElementById(
        "person1"
      )
      .value =
        result.person1 || "";


    document
      .getElementById(
        "person2"
      )
      .value =
        result.person2 || "";


    results.style.display =
      "block";


    status.textContent =
      "✓ Audio converted successfully and saved to Google Sheets.";


  } catch (error) {

    console.error(error);

    status.textContent =
      "ERROR: " +
      error.message;

  } finally {

    button.disabled =
      false;

    button.textContent =
      "Convert Audio to Text";

  }

}


// ============================================================
// FILE TO BASE64
// ============================================================

function fileToBase64(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          try {

            const result =
              reader.result;

            const commaIndex =
              result.indexOf(",");


            if (commaIndex === -1) {

              reject(
                new Error(
                  "Invalid audio file format."
                )
              );

              return;

            }


            const base64 =
              result.substring(
                commaIndex + 1
              );


            if (!base64) {

              reject(
                new Error(
                  "Audio file is empty."
                )
              );

              return;

            }


            resolve(base64);

          } catch (error) {

            reject(error);

          }

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Could not read the audio file."
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}

</script>

</body>

</html>
